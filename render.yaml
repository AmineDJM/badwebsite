services:
  - type: web
    name: gmaps-scraper-manager
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard # headless Chromium is memory-hungry; "starter" (512MB) can OOM,
                    # especially with -email or -extra_reviews jobs. Downgrade only
                    # for light/low-depth scraping.
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: scraper-data
      mountPath: /data
      sizeGB: 5 # stores jobs.db (SQLite) + every job's result CSV — without this
                # disk, all job history and results are wiped on every deploy/restart.
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true # set/override this in the Render dashboard to whatever
                             # you want; without it (and ADMIN_USERNAME) the UI is
                             # unauthenticated.
      - key: DATA_FOLDER
        value: /data
      - key: SCRAPER_INTERNAL_PORT
        value: "8081"
      - key: SCRAPER_CONCURRENCY
        value: "2" # global "speed" knob (-c flag): how many searches the engine
                    # processes in parallel *within* a single job. Higher = faster
                    # but more RAM/CPU per Chromium tab; raise together with `plan:`
                    # above. Jobs themselves still run one at a time (see the FIFO
                    # queue in server.js) — this only affects how fast each one goes.
      - key: DEFAULT_PROXIES
        sync: false # optional. Leave empty to run without proxies (fine for light
                     # use). For heavy/daily scraping set it here — see README
                     # "Proxies". Use ONE sticky-session URL with a {session}
                     # placeholder, e.g.
                     #   http://user-FR-{session}:pass@p.webshare.io:80
                     # {session} is replaced with a fresh id on every dispatch:
                     # one stable IP per job, a new one between jobs. Every job
                     # that doesn't specify its own proxies uses this.
      - key: PROXY_LIST_URL
        sync: false # optional alternative to DEFAULT_PROXIES: a provider's
                     # "proxy list" download link (e.g. Webshare's
                     # https://proxy.webshare.io/api/v2/proxy/list/download/...).
                     # Downloaded at boot, refreshed periodically, converted from
                     # ip:port:user:pass, and rotated one proxy per job. Contains
                     # an API token — set it here, never in code.
      - key: JOB_MAX_ATTEMPTS
        value: "3" # a job that comes back with 0 results is retried this many
                    # times before being marked failed
      - key: JOB_RETRY_DELAY_MINUTES
        value: "5" # attempt n waits n × this; a block doesn't clear in seconds
      - key: BLOCK_PAUSE_THRESHOLD
        value: "3" # after this many consecutive jobs with no usable result, the
                    # whole queue pauses instead of burning the rest for nothing
      - key: JOB_DELAY_SECONDS
        value: "30" # breathing room between jobs — back-to-back hammering is
                     # what gets an IP flagged
      - key: SCRAPER_BROWSER_POOL_SIZE
        value: "0" # advanced, only relevant if DEFAULT_PROXIES/per-job proxies
                    # lists several *individual* static proxy IPs instead of one
                    # rotating gateway: the engine binds one proxy per browser
                    # instance for that browser's whole run, round-robin across
                    # the list — raise this to (roughly) your proxy count so they
                    # actually all get used. 0 = let the engine pick automatically
                    # (fine for 0 or 1 proxy / a rotating gateway).
